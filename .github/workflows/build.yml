name: build-desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r server/requirements.txt -r build-requirements.txt

      - name: Build python-server sidecar (PyInstaller)
        run: pyinstaller --clean -y cuotiji.spec

      - name: Stage sidecar binary for Tauri
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp dist/python-server "src-tauri/binaries/python-server-aarch64-apple-darwin"
            chmod +x "src-tauri/binaries/python-server-aarch64-apple-darwin"
          else
            cp dist/python-server.exe "src-tauri/binaries/python-server-x86_64-pc-windows-msvc.exe"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps (none) & Tauri CLI
        run: cargo install tauri-cli --version '^2'

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ./src-tauri

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cuotiji-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
