[package]
name = "error-notebook"
version = "0.0.1"
description = "学生错题集（Tauri 壳 + Python sidecar）"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
